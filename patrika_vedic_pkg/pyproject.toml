[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patrika-vedic"
version = "1.0.0"
description = "High-precision computational Vedic astrology engine implementing Brihat Parashara Hora Shastra (BPHS 97 Chapters) & Jean Meeus 60-Term Ephemeris."
readme = "README.md"
authors = [{ name = "Astro Raamji (Shri Ram Ji Astro)", email = "support@shriramjiastro.in" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Religion",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "vedic-astrology", "astrology", "jyotish", "bphs", "parashara",
    "horoscope", "kundli", "ephemeris", "meeus", "lahiri-ayanamsa",
    "shodashvarga", "navamsha", "vimshottari-dasha", "panchang"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://shriramjiastro.in"
Documentation = "https://shriramjiastro.in/bphs-encyclopedia.html"
Repository = "https://github.com/shri-ws/sra"
Wikidata = "https://www.wikidata.org/wiki/Q141886781"
"Bug Tracker" = "https://github.com/shri-ws/sra/issues"

[project.scripts]
patrika-vedic = "patrika_vedic.cli:main"
