<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<!-- Banner for one blog article (assets/blog-og/<slug>.jpg), rendered by tools/render_blog_banners.py.
     Query: t=title s=subtitle c=category g=centre word m=motif h=palette.
     Everything is drawn in one 1200×630 SVG coordinate space, so nothing shifts between renders. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;800&family=Noto+Sans+Devanagari:wght@500;600;700&family=Cinzel:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  svg { display: block; }
  .deva { font-family: 'Noto Sans Devanagari', sans-serif; }
  .serif { font-family: 'Noto Serif Devanagari', serif; }
  .caps { font-family: 'Cinzel', serif; }
</style></head>
<body>
<svg id="b" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"></svg>
<script>
// Fonts first: text widths decide where the title wraps
Promise.all(['800 74px "Noto Serif Devanagari"', '600 28px "Noto Sans Devanagari"', '700 20px "Noto Sans Devanagari"', '700 21px Cinzel']
  .map(spec => document.fonts.load(spec, 'शनि A'))).then(draw, draw);
function draw() {
const P = new URLSearchParams(location.search);
const PALETTES = {           // [deep, mid, glow, accent, ink]
  kumkum:  ['#21060b', '#4a0f1b', '#7a1d2b', '#e0b464', '#fff6e6'],
  indigo:  ['#070a1f', '#141a46', '#2b3486', '#d9bb6e', '#f3f0ff'],
  emerald: ['#04140f', '#0c3326', '#17604a', '#e2c174', '#effaf4'],
  saffron: ['#1c0b02', '#4b2108', '#8a4210', '#f2cf7f', '#fff4e3'],
  plum:    ['#16061a', '#3a1142', '#6a2470', '#eac37a', '#fbefff'],
  bronze:  ['#140d04', '#3a2a10', '#6d5220', '#f0d58c', '#fff7e2'],
  violet:  ['#0e0820', '#26185a', '#4b2fa0', '#e6c97c', '#f4efff'],
  teal:    ['#031417', '#0b3640', '#15646f', '#e7c97d', '#ecfbfc'],
  midnight:['#03070f', '#0b1a33', '#173a6b', '#e3c574', '#eef4ff'],
  forest:  ['#060f06', '#16301a', '#2d5a2f', '#e6cc7e', '#f2faef'],
  ruby:    ['#1a0306', '#4d0a14', '#8f1426', '#f3cd7e', '#fff1ee'],
  slate:   ['#07090c', '#1a2029', '#36404e', '#dcc79a', '#eef1f5'],
  copper:  ['#160903', '#3e1d0c', '#7a3a18', '#f0c88a', '#fff2e6'],
  rose:    ['#18050f', '#401229', '#78254d', '#efc989', '#fff0f6'],
  maroon:  ['#120304', '#33090d', '#5e1a1e', '#e8c27a', '#fdf0ea'],
  sapphire:['#030a1a', '#0a2050', '#1846a0', '#ecd08a', '#eef4ff'],
  jade:    ['#03110d', '#0b2f27', '#17594a', '#ebd497', '#eefbf6'],
  amber:   ['#140c02', '#3d2806', '#76500e', '#f6dc95', '#fff8e6'],
  ocean:   ['#020c14', '#06283d', '#0f4f73', '#e9cd88', '#ecf7fd'],
  olive:   ['#0c0d03', '#2a2c0c', '#55581c', '#ead48c', '#f8f8ea'],
  cobalt:  ['#020818', '#071d4a', '#0f3c8c', '#f1d58e', '#edf3ff'],
  garnet:  ['#16030a', '#3d0a1e', '#731638', '#f0c98a', '#fff0f4'],
  steel:   ['#05080b', '#16222c', '#2c4252', '#d9c9a0', '#eef3f6'],
  rust:    ['#150703', '#3d160a', '#7a2e14', '#f2c884', '#fff1e8'],
  pine:    ['#020e09', '#08281b', '#124a33', '#e8d18f', '#ecfaf2'],
  mauve:   ['#110814', '#2e1a36', '#583468', '#ebcd92', '#f8efff'],
  wine:    ['#120208', '#350716', '#62122b', '#efcb86', '#fff0f2'],
  moss:    ['#070c03', '#1d2a0d', '#3b521a', '#e9d48f', '#f4fae9'],
  dusk:    ['#10060f', '#2c1230', '#5a2552', '#f4c97e', '#fff1fb'],
  ash:     ['#09090a', '#1e1f22', '#3b3d42', '#e2cc94', '#f3f3f1'],
  teak:    ['#120a04', '#33200f', '#64401e', '#f0d090', '#fff6ea'],
  saffron2:['#170902', '#45200a', '#9a4a12', '#fbe1a0', '#fff6e8'],
  ice:     ['#040b12', '#10263a', '#24506f', '#e4d3a4', '#eef7fc'],
  ember:   ['#170401', '#470f05', '#8e220c', '#f8cf7c', '#fff0e6'],
  night:   ['#02040c', '#0a1430', '#1a2d63', '#e8d29a', '#eef2ff'],
  pearl:   ['#0d0b10', '#2a2533', '#544a63', '#f0dcae', '#fbf8ff'],
  iron:    ['#060708', '#16191d', '#2c3238', '#cdbb8e', '#eef0f2'],
  sunrise: ['#180502', '#4e1306', '#a8360c', '#ffd98a', '#fff4e4'],
  gold:    ['#120c01', '#3b2a04', '#7a5a0a', '#ffe39a', '#fff9e8'],
  rosegold:['#160709', '#3f1a1f', '#7d3c3f', '#f3cf9e', '#fff2ef'],
  lapis:   ['#030616', '#0b1745', '#1d3592', '#efd68e', '#eef1ff'],
  ochre:   ['#130b01', '#3c2505', '#7c4d0b', '#fbdc92', '#fff7e6'],
  orchid:  ['#12051a', '#311042', '#5e2479', '#f2cf8c', '#fbf0ff'],
  sage:    ['#070c08', '#1b2a1e', '#36513b', '#e7d49b', '#f1f8f2'],
  cocoa:   ['#0f0805', '#2c1b12', '#563626', '#ecca96', '#fbf3ec'],
  lagoon:  ['#021013', '#062f36', '#0d5c66', '#ecd492', '#ebfbfc'],
  scarlet: ['#170204', '#4a0710', '#931222', '#fdd281', '#fff0ee'],
  sand:    ['#120e07', '#352a17', '#6b5530', '#f6e0a8', '#fffaf0'],
  smoke:   ['#08080b', '#1b1b24', '#363648', '#dccba0', '#f2f2f7'],
  berry:   ['#14040c', '#3a0d26', '#701a4a', '#f4cd8e', '#fff0f7'],
  fern:    ['#030d06', '#0d2a15', '#1d532b', '#ecd690', '#effaf1'],
};
const [DEEP, MID, GLOW, GOLD, INK] = PALETTES[P.get('h')] || PALETTES.kumkum;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('b');
const el = (tag, attrs, parent = svg, text) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  parent.appendChild(n); return n;
};
const CX = 905, CY = 300, R = 185;            // the diagram's exact centre and radius
const pt = (r, deg) => [CX + r * Math.cos((deg - 90) * Math.PI / 180), CY + r * Math.sin((deg - 90) * Math.PI / 180)];
const f = (n) => n.toFixed(2);

// background: soft radial light behind the diagram, darker on the title side
const defs = el('defs', {});
const bg = el('radialGradient', { id: 'bg', cx: CX / 1200, cy: 0.5, r: 0.85 }, defs);
el('stop', { offset: '0', 'stop-color': GLOW }, bg);
el('stop', { offset: '0.45', 'stop-color': MID }, bg);
el('stop', { offset: '1', 'stop-color': DEEP }, bg);
const halo = el('radialGradient', { id: 'halo' }, defs);
el('stop', { offset: '0', 'stop-color': GOLD, 'stop-opacity': 0.28 }, halo);
el('stop', { offset: '1', 'stop-color': GOLD, 'stop-opacity': 0 }, halo);
el('rect', { width: 1200, height: 630, fill: 'url(#bg)' });
el('circle', { cx: CX, cy: CY, r: R * 1.25, fill: 'url(#halo)' });

// fine star field (fixed seed, so a banner always renders the same)
let seed = [...(P.get('t') || 'x')].reduce((a, c) => a + c.charCodeAt(0), 7);
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 90; i++) el('circle', { cx: f(rnd() * 1200), cy: f(rnd() * 630), r: f(0.4 + rnd() * 1.1), fill: INK, opacity: f(0.15 + rnd() * 0.45) });

// double gold frame
el('rect', { x: 24, y: 24, width: 1152, height: 582, rx: 18, fill: 'none', stroke: GOLD, 'stroke-opacity': 0.55, 'stroke-width': 1.5 });
el('rect', { x: 33, y: 33, width: 1134, height: 564, rx: 13, fill: 'none', stroke: GOLD, 'stroke-opacity': 0.22 });

// ---------- motifs: each article picks one, all centred on (CX, CY) ----------
const g = el('g', { fill: 'none', stroke: GOLD, 'stroke-linecap': 'round' });
const ring = (r, o = 0.6, w = 1.2) => el('circle', { cx: CX, cy: CY, r, 'stroke-opacity': o, 'stroke-width': w }, g);
const line = (a, b, o = 0.5, w = 1) => el('line', { x1: f(a[0]), y1: f(a[1]), x2: f(b[0]), y2: f(b[1]), 'stroke-opacity': o, 'stroke-width': w }, g);
const dot = (p, r, o = 0.9) => el('circle', { cx: f(p[0]), cy: f(p[1]), r, fill: GOLD, stroke: 'none', opacity: o }, g);
const label = (p, text, size = 15, o = 0.75) => el('text', { x: f(p[0]), y: f(p[1]), 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'deva', 'font-size': size, fill: GOLD, stroke: 'none', opacity: o }, g, text);
const RASHI = ['मेष', 'वृष', 'मिथुन', 'कर्क', 'सिंह', 'कन्या', 'तुला', 'वृश्चिक', 'धनु', 'मकर', 'कुंभ', 'मीन'];

const MOTIFS = {
  // zodiac wheel: 12 houses with rashi names
  wheel() {
    ring(R, 0.75, 1.6); ring(R - 38, 0.45); ring(R * 0.42, 0.55);
    for (let i = 0; i < 12; i++) { line(pt(R * 0.42, i * 30), pt(R, i * 30), 0.4); label(pt(R - 19, i * 30 + 15), RASHI[i], 13); }
  },
  // North Indian kundali: square, diagonals and the inner diamond
  kundali() {
    const s = R * 1.32, x0 = CX - s / 2, y0 = CY - s / 2;
    el('rect', { x: f(x0), y: f(y0), width: f(s), height: f(s), 'stroke-opacity': 0.8, 'stroke-width': 1.6 }, g);
    line([x0, y0], [x0 + s, y0 + s], 0.55); line([x0 + s, y0], [x0, y0 + s], 0.55);
    el('polygon', { points: [[CX, y0], [x0 + s, CY], [CX, y0 + s], [x0, CY]].map(p => p.map(f).join(',')).join(' '), 'stroke-opacity': 0.7, 'stroke-width': 1.3 }, g);
    ring(R * 1.0, 0.18);
  },
  // three concentric orbits (three phases) with a planet on each
  orbits() {
    [R, R * 0.74, R * 0.48].forEach((r, i) => { ring(r, 0.65 - i * 0.12, 1.3); dot(pt(r, 40 + i * 110), 7 - i); });
    for (let i = 0; i < 12; i++) line(pt(R + 6, i * 30), pt(R + 16, i * 30), 0.6);
  },
  // Rahu–Ketu axis: an eclipse orbit with two opposite nodes
  axis() {
    ring(R, 0.7, 1.5);
    el('ellipse', { cx: CX, cy: CY, rx: R, ry: R * 0.38, transform: `rotate(-24 ${CX} ${CY})`, 'stroke-opacity': 0.55, 'stroke-width': 1.2 }, g);
    const n1 = [CX + R * Math.cos(-24 * Math.PI / 180), CY + R * Math.sin(-24 * Math.PI / 180)];
    const n2 = [2 * CX - n1[0], 2 * CY - n1[1]];
    line(n1, n2, 0.5, 1); dot(n1, 9); el('circle', { cx: f(n2[0]), cy: f(n2[1]), r: 9, 'stroke-opacity': 0.9, 'stroke-width': 2 }, g);
  },
  // serpent: all planets on one side of the Rahu–Ketu line
  serpent() {
    ring(R, 0.6, 1.4);
    line(pt(R, 0), pt(R, 180), 0.65, 1.4);
    for (let i = 0; i < 7; i++) dot(pt(R * 0.78, 22 + i * 22.5), 4.5, 0.85);
    let d = ''; for (let k = 0; k <= 40; k++) { const y = CY - R + (2 * R) * k / 40; const x = CX - 26 * Math.sin(k / 40 * Math.PI * 4); d += (k ? 'L' : 'M') + f(x) + ' ' + f(y); }
    el('path', { d, 'stroke-opacity': 0.55, 'stroke-width': 1.6 }, g);
  },
  // two interlocking circles with an 8-petal ring (eight koots)
  union() {
    ring(R, 0.35);
    el('circle', { cx: CX - 62, cy: CY, r: R * 0.62, 'stroke-opacity': 0.75, 'stroke-width': 1.5 }, g);
    el('circle', { cx: CX + 62, cy: CY, r: R * 0.62, 'stroke-opacity': 0.75, 'stroke-width': 1.5 }, g);
    for (let i = 0; i < 8; i++) dot(pt(R, i * 45), 5);
  },
  // lotus: 16 petals (tarpan, offering)
  lotus() {
    ring(R * 0.42, 0.7, 1.4); ring(R, 0.25);
    for (let i = 0; i < 16; i++) {
      const a = i * 22.5, tip = pt(R * 0.95, a), l = pt(R * 0.46, a - 9), r = pt(R * 0.46, a + 9), c1 = pt(R * 0.8, a - 11), c2 = pt(R * 0.8, a + 11);
      el('path', { d: `M${f(l[0])} ${f(l[1])} Q${f(c1[0])} ${f(c1[1])} ${f(tip[0])} ${f(tip[1])} Q${f(c2[0])} ${f(c2[1])} ${f(r[0])} ${f(r[1])}`, 'stroke-opacity': 0.6, 'stroke-width': 1.2 }, g);
    }
  },
  // shatkona yantra: rising and falling triangles
  yantra() {
    ring(R, 0.7, 1.5); ring(R * 0.9, 0.35);
    const tri = (rot) => el('polygon', { points: [0, 120, 240].map(a => pt(R * 0.86, a + rot).map(f).join(',')).join(' '), 'stroke-opacity': 0.75, 'stroke-width': 1.4 }, g);
    tri(0); tri(180); ring(R * 0.42, 0.5);
  },
  // nakshatra ring: 27 stars, 9 arcs sized by Vimshottari years
  dasha() {
    const YEARS = [7, 20, 6, 10, 7, 18, 16, 19, 17]; let a = 0;
    YEARS.forEach((y, i) => {
      const span = y * 3, p1 = pt(R, a + 1.2), p2 = pt(R, a + span - 1.2);
      el('path', { d: `M${f(p1[0])} ${f(p1[1])} A${R} ${R} 0 ${span > 180 ? 1 : 0} 1 ${f(p2[0])} ${f(p2[1])}`, 'stroke-opacity': i % 2 ? 0.45 : 0.9, 'stroke-width': 5 }, g);
      a += span;
    });
    for (let i = 0; i < 27; i++) dot(pt(R - 26, i * 360 / 27), 2.6, 0.75);
    ring(R * 0.5, 0.5);
  },
  // three nadis: three waves through a ring of 27 nakshatras
  nadi() {
    ring(R, 0.6, 1.4);
    for (let i = 0; i < 27; i++) dot(pt(R, i * 360 / 27), 3, 0.8);
    [-1, 0, 1].forEach((k) => {
      let d = ''; for (let s = 0; s <= 60; s++) { const x = CX - R * 0.8 + 1.6 * R * s / 60; const y = CY + k * 46 + 18 * Math.sin(s / 60 * Math.PI * 3 + k); d += (s ? 'L' : 'M') + f(x) + ' ' + f(y); }
      el('path', { d, 'stroke-opacity': 0.75 - Math.abs(k) * 0.15, 'stroke-width': 1.6 }, g);
    });
  },
  // five great persons: a five-pointed star, a planet at each point
  star() {
    ring(R, 0.65, 1.5); ring(R * 0.4, 0.4);
    const tips = [0, 1, 2, 3, 4].map(i => pt(R * 0.92, i * 72));
    el('polygon', { points: [0, 2, 4, 1, 3].map(i => tips[i].map(f).join(',')).join(' '), 'stroke-opacity': 0.7, 'stroke-width': 1.4, 'stroke-linejoin': 'round' }, g);
    tips.forEach(p => dot(p, 8));
  },
  // lone Moon: twelve houses, the two beside the Moon left empty
  lonemoon() {
    ring(R, 0.6, 1.4); ring(R - 34, 0.3);
    for (let i = 0; i < 12; i++) line(pt(R - 34, i * 30 + 15), pt(R, i * 30 + 15), 0.35);
    for (let a = 60; a <= 300; a += 30) dot(pt(R - 17, a), 4.5, 0.85);
    [-30, 30].forEach(a => el('circle', { cx: f(pt(R - 17, a)[0]), cy: f(pt(R - 17, a)[1]), r: 6, 'stroke-opacity': 0.45, 'stroke-dasharray': '2 3' }, g));
    const m = pt(R - 17, 0);
    // crescent: outer arc of radius 13, inner arc of radius 16 through the same two horn tips
    el('path', { d: `M${f(m[0])} ${f(m[1] - 13)} A13 13 0 1 0 ${f(m[0])} ${f(m[1] + 13)} A16 16 0 0 1 ${f(m[0])} ${f(m[1] - 13)}Z`, fill: GOLD, stroke: 'none' }, g);
  },
  // swapped places: twelve houses, full and hollow planets exchanged
  swap() {
    ring(R, 0.6, 1.4); ring(R * 0.62, 0.35);
    for (let i = 0; i < 12; i++) {
      const p = pt(R * 0.81, i * 30);
      if (i % 3 === 0) el('circle', { cx: f(p[0]), cy: f(p[1]), r: 9, 'stroke-opacity': 0.85, 'stroke-width': 1.6 }, g); else dot(p, 4, 0.7);
    }
    [[0, 6], [3, 9]].forEach(([a, b]) => line(pt(R * 0.62, a * 30), pt(R * 0.62, b * 30), 0.3));
  },
  // arudha: the count from a house to its lord, repeated the same distance on
  arudha() {
    ring(R, 0.6, 1.4);
    for (let i = 0; i < 12; i++) dot(pt(R, i * 30), 3, 0.6);
    const a = pt(R, 330), b = pt(R, 90), c = pt(R, 210);
    el('path', { d: `M${f(a[0])} ${f(a[1])} Q${CX} ${CY} ${f(b[0])} ${f(b[1])}`, 'stroke-opacity': 0.75, 'stroke-width': 1.6 }, g);
    el('path', { d: `M${f(b[0])} ${f(b[1])} Q${CX} ${CY} ${f(c[0])} ${f(c[1])}`, 'stroke-opacity': 0.75, 'stroke-width': 1.6, 'stroke-dasharray': '6 5' }, g);
    dot(a, 8); dot(b, 6, 0.8); el('circle', { cx: f(c[0]), cy: f(c[1]), r: 10, 'stroke-opacity': 0.95, 'stroke-width': 2 }, g);
  },
  // first and seventh house facing each other across the chart
  mirror() {
    ring(R, 0.4);
    for (let i = 0; i < 12; i++) dot(pt(R, i * 30), 3.2, 0.6);
    [270, 90].forEach(a => { const p = pt(R * 0.55, a); el('circle', { cx: f(p[0]), cy: f(p[1]), r: R * 0.36, 'stroke-opacity': 0.75, 'stroke-width': 1.5 }, g); });
    line(pt(R, 270), pt(R, 90), 0.5, 1.2);
  },
  // trik houses: an inverted triangle joining the 6th, 8th and 12th
  trik() {
    ring(R, 0.6, 1.4);
    const H = (n) => pt(R * 0.86, 180 + (n - 1) * 30);
    for (let n = 1; n <= 12; n++) dot(H(n), [6, 8, 12].includes(n) ? 8 : 3, [6, 8, 12].includes(n) ? 0.95 : 0.5);
    el('polygon', { points: [6, 8, 12].map(n => H(n).map(f).join(',')).join(' '), 'stroke-opacity': 0.75, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, g);
    ring(R * 0.42, 0.35);
  },
  // growing spiral: lineage, one generation after another
  spiral() {
    ring(R, 0.4);
    let d = ''; for (let k = 0; k <= 240; k++) { const t = k / 240, a = t * 720, r = 70 + t * (R * 0.95 - 70); const p = pt(r, a); d += (k ? 'L' : 'M') + f(p[0]) + ' ' + f(p[1]); }
    el('path', { d, 'stroke-opacity': 0.75, 'stroke-width': 1.6 }, g);
    [0.25, 0.5, 0.75, 1].forEach(t => dot(pt(70 + t * (R * 0.95 - 70), t * 720), 3 + t * 4));
  },
  // 108 navamsas: twelve signs, each cut into nine
  navamsa() {
    ring(R, 0.75, 1.5); ring(R - 30, 0.45);
    for (let i = 0; i < 108; i++) { const major = i % 9 === 0; line(pt(major ? R - 30 : R - 12, i * 360 / 108), pt(R, i * 360 / 108), major ? 0.7 : 0.4, major ? 1.3 : 0.8); }
    for (let i = 0; i < 12; i++) label(pt(R - 50, i * 30 + 15), RASHI[i], 12, 0.6);
  },
  // eclipse: the Moon's disc crossing the Sun, with a corona
  eclipse() {
    for (let i = 0; i < 48; i++) { const long = i % 2 === 0; line(pt(R * 0.62, i * 7.5), pt(long ? R : R * 0.82, i * 7.5), long ? 0.45 : 0.3); }
    ring(R * 0.55, 0.85, 1.6);
    el('circle', { cx: CX + 34, cy: CY - 22, r: R * 0.52, fill: DEEP, 'fill-opacity': 0.9, 'stroke-opacity': 0.5 }, g);
  },
  // gandanta: three water–fire knots on the zodiac
  gandanta() {
    ring(R, 0.6, 1.4); ring(R - 30, 0.3);
    for (let i = 0; i < 12; i++) label(pt(R - 15, i * 30 + 15), RASHI[i], 12, 0.6);
    [120, 240, 360].forEach(a => {
      const p = pt(R - 15, a);
      el('circle', { cx: f(p[0]), cy: f(p[1]), r: 16, 'stroke-opacity': 0.95, 'stroke-width': 2 }, g); dot(p, 4.5);
      line(pt(R * 0.42, a), pt(R - 31, a), 0.55, 1.2);
    });
    ring(R * 0.42, 0.45);
  },
  // ten dikpalas: ten spokes, one per dashamsha
  dikpala() {
    ring(R, 0.7, 1.5); ring(R * 0.45, 0.4);
    for (let i = 0; i < 10; i++) { line(pt(R * 0.45, i * 36), pt(R * 0.86, i * 36), 0.55, 1.2); dot(pt(R * 0.86, i * 36), 6); }
    for (let i = 0; i < 30; i++) line(pt(R - 8, i * 12), pt(R, i * 12), 0.45);
  },
  // saptamsha: a regular heptagon with a planet at each corner
  heptagon() {
    ring(R, 0.45);
    const c = [0, 1, 2, 3, 4, 5, 6].map(i => pt(R * 0.86, i * 360 / 7));

  vastu() {

    el('rect', { x: f(x0), y: f(y0), width: f(s), height: f(s), 'stroke-opacity': 0.85, 'stroke-width': 1.6 }, g);
    for (let i = 1; i < 8; i++) { line([x0 + i * c, y0], [x0 + i * c, y0 + s], 0.3); line([x0, y0 + i * c], [x0 + s, y0 + i * c], 0.3); }
    el('rect', { x: f(x0 + 2 * c), y: f(y0 + 2 * c), width: f(4 * c), height: f(4 * c), 'stroke-opacity': 0.7, 'stroke-width': 1.3 }, g);
    dot([x0 + s - c / 2, y0 + c / 2], 6);
  },
};
(MOTIFS[P.get('m')] || MOTIFS.wheel)();

// centre medallion with the article's word, exactly at (CX, CY)
el('circle', { cx: CX, cy: CY, r: 62, fill: DEEP, 'fill-opacity': 0.85, stroke: GOLD, 'stroke-opacity': 0.9, 'stroke-width': 1.5 });
const word = P.get('g') || 'ॐ';
el('text', { x: CX, y: CY, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'serif', 'font-weight': 800,
  'font-size': word.length > 4 ? 26 : word.length > 2 ? 34 : 54, fill: GOLD }, svg, word);

// title side
el('text', { x: 84, y: 92, class: 'caps', 'font-size': 21, 'letter-spacing': 6, fill: GOLD }, svg, 'SHRI RAMJI ASTRO');
const cat = P.get('c') || '';
const catText = el('text', { x: 104, y: 137, 'dominant-baseline': 'central', class: 'deva', 'font-weight': 700, 'font-size': 20, fill: DEEP }, svg, cat);
const cw = catText.getComputedTextLength();
svg.insertBefore(el('rect', { x: 84, y: 120, width: f(cw + 40), height: 34, rx: 17, fill: GOLD }), catText);

// title: wrap into at most 3 lines inside 560px, shrinking the size until it fits
const title = (P.get('t') || '').split(' ');
const tEl = el('text', { x: 84, class: 'serif', 'font-weight': 800, fill: INK });
for (let size = 74; size >= 40; size -= 4) {
  tEl.setAttribute('font-size', size); tEl.textContent = '';
  const lines = []; let cur = '';
  const probe = el('text', { class: 'serif', 'font-weight': 800, 'font-size': size, visibility: 'hidden' });
  for (const w of title) { probe.textContent = cur ? cur + ' ' + w : w; if (probe.getComputedTextLength() > 560 && cur) { lines.push(cur); cur = w; } else cur = probe.textContent; }
  lines.push(cur); probe.remove();
  if (lines.length <= 3) {
    const lh = size * 1.28, top = 290 - (lines.length - 1) * lh / 2;
    lines.forEach((l, i) => el('tspan', { x: 84, y: f(top + i * lh), 'dominant-baseline': 'central' }, tEl, l));
    break;
  }
}
el('text', { x: 84, y: 470, class: 'deva', 'font-weight': 600, 'font-size': 28, fill: GOLD }, svg, P.get('s') || '');
el('line', { x1: 84, y1: 512, x2: 1116, y2: 512, stroke: GOLD, 'stroke-opacity': 0.25 });
el('text', { x: 84, y: 548, class: 'deva', 'font-weight': 500, 'font-size': 19, fill: INK, opacity: 0.75 }, svg, 'एस्ट्रो रामजी · शास्त्रीय वैदिक ज्योतिष');
el('text', { x: 1116, y: 548, 'text-anchor': 'end', class: 'deva', 'font-weight': 600, 'font-size': 19, fill: INK, opacity: 0.8 }, svg, 'shriramjiastro.in');
document.title = 'ready';
}
</script>
