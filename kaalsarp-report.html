<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Paid report (₹251, server-confirmed unlock). Rules: kaalsarpRules.js (built from data/sarpa_rahu_ketu). -->

<title>कालसर्प व सर्प-योग रिपोर्ट (शास्त्र-प्रमाण सहित) | श्री राम जी एस्ट्रो</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
  :root { --maroon:#5b1a0e; --gold:#b8862b; --cream:#fffaf0; --ink:#2b1a12; --muted:#6f5a4b; --line:#ead9b8; --green:#166a43; --red:#9a1b0a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: 'Noto Sans Devanagari', system-ui, sans-serif; color: var(--ink); background: #f5ecdc; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 14px 60px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .top img { width: 40px; height: 40px; border-radius: 50%; }
  .top b { color: var(--maroon); font-size: 18px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 18px; color: var(--maroon); }
  select, button { font: inherit; }
  select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--cream); font-size: 15px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; cursor: pointer; font-size: 15px; text-decoration: none; display: inline-block; }
  .btn.go { background: var(--maroon); color: #fff; }
  .btn.pdf { background: var(--green); color: #fff; }
  .btn.ghost { background: var(--cream); color: var(--maroon); border: 1px solid var(--line); }
  .muted { color: var(--muted); font-size: 13.5px; }
  #status { margin-top: 10px; font-size: 14px; color: var(--muted); }

  /* ---- report (also what goes into the PDF) ---- */
  #report { background: #fff; color: var(--ink); }
  .rp { padding: 26px 30px; }
  .rp-head { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 12px; margin-bottom: 16px; }
  .rp-head h1 { font-family: 'Tiro Devanagari Sanskrit', serif; color: var(--maroon); font-weight: 400; font-size: 27px; margin: 4px 0; }
  .rp-head .sub { color: var(--muted); font-size: 13.5px; }
  .rp-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 14px; margin-bottom: 14px; }
  .rp-chart { display: flex; justify-content: center; margin: 8px 0 14px; }
  .rp-chart svg, .rp-chart img { max-width: 330px; width: 100%; height: auto; }
  .verdict { border-radius: 12px; padding: 14px 16px; margin: 6px 0 18px; border: 1.5px solid; }
  .verdict.yes { background: #fff3e8; border-color: #e3a35a; }
  .verdict.no { background: #ecf7f0; border-color: #9fd3b4; }
  .verdict b { font-size: 17px; color: var(--maroon); display: block; margin-bottom: 4px; }
  .sec { margin-top: 18px; }
  .sec > h3 { font-size: 17px; color: var(--maroon); border-left: 4px solid var(--gold); padding-left: 9px; margin: 0 0 10px; }
  .rule { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; break-inside: avoid; page-break-inside: avoid; }
  .rule.on { border-color: #e3a35a; background: #fffaf2; }
  .rule-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .rule-h b { font-size: 15.5px; color: var(--ink); }
  .badge { flex: 0 0 auto; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge.on { background: #fde2c4; color: #8a4a06; }
  .badge.off { background: #e6f4ea; color: var(--green); }
  .why { font-size: 14px; margin: 6px 0 8px; color: #3b2a20; }
  .src { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  .shloka { font-family: 'Tiro Devanagari Sanskrit', serif; font-size: 16.5px; line-height: 1.6; color: #4a1608; background: #fbf4e6; border-radius: 8px; padding: 8px 12px; margin: 4px 0 6px; }
  .ref { font-size: 12.8px; color: var(--muted); }
  .ref b { color: var(--maroon); }
  .st { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; margin-left: 4px; }
  .st.book_verified { background: #e6f4ea; color: var(--green); }
  .st.etext_unverified, .st.ocr_reconstructed { background: #fff2cc; color: #7a5a00; }
  .st.tradition, .st.modern, .st.reference { background: #ede7f6; color: #4b3a8a; }
  .arth { font-size: 13.5px; margin-top: 4px; }
  .note { font-size: 12.8px; color: #7a3b0a; margin-top: 6px; }
  .biblio li { font-size: 13px; margin-bottom: 5px; }
  .pw-badge { display:inline-block; background:#fdecea; color:#b3261e; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
  .pw-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin:12px 0; }
  .pw-list div { background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.5px; }
  .pw-list b { display:block; color:var(--maroon); font-size:14px; }
  .pw-price { display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--line); padding-top:10px; margin-top:6px; font-weight:700; }
  .pw-price span:last-child { font-size:26px; color:var(--maroon); }
  .pw-pay { width:100%; margin-top:12px; background:var(--green); color:#fff; border:0; border-radius:12px; padding:14px; font-size:17px; font-weight:800; cursor:pointer; }
  .pw-code { display:flex; gap:8px; margin-top:8px; }
  .pw-code input { flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:8px; text-transform:uppercase; font-weight:700; }
  .disc { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 18px; padding-top: 10px; }
</style>
<link rel="stylesheet" href="ui-overrides.css">
<link rel="stylesheet" href="sra-elegance.css">
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.jpg" alt=""><b>श्री राम जी एस्ट्रो — कालसर्प व सर्प-योग रिपोर्ट</b></div>

  <div class="panel" id="picker">
    <h2>कुंडली चुनें</h2>
    <select id="kundaliSel"></select>
    <div class="muted" style="margin-top:6px">सूची में वही कुंडलियाँ हैं जो इस फ़ोन/कंप्यूटर पर पत्रिका में बनाई गई हैं। नई कुंडली: <a href="patrika.html">पत्रिका पर बनाएँ ↗</a></div>
    <label class="muted" for="phoneIn" style="display:block;margin-top:12px">आपका मोबाइल नंबर (भुगतान व रसीद के लिए)</label>
    <input id="phoneIn" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--cream);font-size:15px;margin-top:4px">
    <div class="btns">
      <button class="btn go" id="makeBtn" type="button">रिपोर्ट बनाएँ</button>
      <button class="btn pdf" id="pdfBtn" type="button" hidden>⬇ PDF डाउनलोड</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="panel" id="paywall" hidden></div>
  <div id="report" hidden></div>
</div>

<script src="sra-config.js"></script>
<script src="sra-auth.js"></script>
<script src="sra-records.js"></script>
<script src="sra-coupon-engine.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="patrikaEngineBridge.js?v=13"></script>
<script src="kaalsarpRules.js?v=2"></script>
<script src="html2pdf.bundle.min.js?v=13"></script>
<script src="sra-ui.js?v=32"></script>
<script src="sra-translate.js"></script>
<script src="sra-nav.js"></script>
<script src="sra-analytics.js" defer></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const STATUS = {
    book_verified: 'छपी पुस्तक से मिलाया', etext_unverified: 'ऑनलाइन पाठ — पुस्तक से मिलान बाक़ी',
    ocr_reconstructed: 'स्कैन से पढ़ा — पुस्तक से मिलान बाक़ी', tradition: 'परंपरा — श्लोक-प्रमाण नहीं',
    modern: 'आधुनिक लेखक', reference: 'संदर्भ'
  };
  let list = [], current = null;

  function loadList() {
    list = (window.PatrikaEngineBridge && PatrikaEngineBridge.getAllSavedKundalis) ? PatrikaEngineBridge.getAllSavedKundalis() : [];
    $('kundaliSel').innerHTML = list.length
      ? list.map((k, i) => `<option value="${i}">${esc(k.name)} — ${esc(k.date)} ${esc(k.time)} · ${esc(k.city || '')}</option>`).join('')
      : '<option value="">कोई सेव कुंडली नहीं — पहले पत्रिका पर कुंडली बनाएँ</option>';
  }

  function refLine(s) {
    const bits = [];
    if (s.chapter) bits.push(`अध्याय ${esc(s.chapter)}${s.chapter_title ? ' (' + esc(s.chapter_title) + ')' : ''}`);
    if (s.verse) bits.push(`श्लोक ${esc(s.verse)}`);
    if (s.printed_page) bits.push(`पृष्ठ ${esc(s.printed_page)}`);
    return `📖 <b>${esc(s.granth)}</b>${bits.length ? ' · ' + bits.join(' · ') : ''}<span class="st ${esc(s.status)}">${esc(STATUS[s.status] || s.status)}</span>`
      + (s.edition ? `<br><span>संस्करण: ${esc(s.edition)}</span>` : '');
  }

  function srcBlock(s) {
    return `<div class="src">
      ${s.text && s.text.length ? `<div class="shloka">${s.text.map(esc).join('<br>')}</div>` : ''}
      <div class="ref">${refLine(s)}</div>
      ${s.arth_hi ? `<div class="arth"><b>अर्थ:</b> ${esc(s.arth_hi)}</div>` : ''}
      ${s.check ? `<div class="ref" style="margin-top:3px">जाँच-टिप्पणी: ${esc(s.check)}</div>` : ''}
    </div>`;
  }

  function ruleCard(r) {
    return `<div class="rule ${r.applies ? 'on' : ''}">
      <div class="rule-h"><b>${esc(r.title)}</b><span class="badge ${r.applies ? 'on' : 'off'}">${r.applies ? 'आपकी कुंडली में है' : 'नहीं है'}</span></div>
      <div class="why">${esc(r.why)}</div>
      ${r.note ? `<div class="note">ध्यान दें: ${esc(r.note)}</div>` : ''}
      ${r.sources.map(srcBlock).join('')}
    </div>`;
  }

  function render(k, calc, res) {
    const ks = res.kalasarpa;
    const groups = {};
    res.rules.slice(1).forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
    const order = ['शास्त्रीय योग', 'सर्प-शाप (संतान)', 'सर्प-भय', 'ग्रहण-जन्म', 'सर्प-द्रेष्काण', 'राहु-केतु का प्रभाव', 'राहु-केतु के अन्य शास्त्रीय योग'];
    const books = {};
    res.rules.concat(res.remedies).forEach(r => r.sources.forEach(s => {
      const key = s.granth + '|' + (s.edition || '');
      const b = books[key] = books[key] || { granth: s.granth, edition: s.edition, refs: new Set() };
      b.refs.add([s.chapter ? 'अ.' + s.chapter : '', s.verse ? 'श्लो.' + s.verse : '', s.printed_page ? 'पृ.' + s.printed_page : ''].filter(Boolean).join(' '));
    }));
    let svg = '';
    try { svg = PatrikaEngineBridge.renderNorthIndianChartSVG(calc, 'Rahu'); } catch (e) { svg = ''; }
    $('report').innerHTML = `<div class="rp">
      <div class="rp-head">
        <div class="sub">श्री राम जी एस्ट्रो · shriramjiastro.in</div>
        <h1>कालसर्प व सर्प-योग रिपोर्ट</h1>
        <div class="sub">हर नियम के साथ मूल श्लोक, ग्रंथ, अध्याय, श्लोक-संख्या और पृष्ठ</div>
      </div>
      <div class="rp-meta">
        <div><b>नाम:</b> ${esc(k.name)}</div><div><b>जन्म:</b> ${esc(k.date)}, ${esc(k.time)}</div>
        <div><b>स्थान:</b> ${esc(k.city || (k.lat + ', ' + k.lon))}</div><div><b>लग्न:</b> ${esc(res.lagna)}</div>
        <div><b>राहु:</b> ${esc(res.rahu)}</div><div><b>केतु:</b> ${esc(res.ketu)}</div>
      </div>
      ${svg ? `<div class="rp-chart">${svg}</div>` : ''}
      <div class="verdict ${ks.applies ? 'yes' : 'no'}">
        <b>${ks.applies ? (ks.full ? 'कालसर्प योग: हाँ — "' + esc(ks.name) + '"' : 'आंशिक कालसर्प: "' + esc(ks.name) + '"') : 'कालसर्प योग: नहीं'}</b>
        <div class="why">${esc(ks.why)}</div>
        <div class="note">कालसर्प योग परंपरा से माना जाता है; बृहत्पाराशर, बृहज्जातक, फलदीपिका, जातक पारिजात, मानसागरी के उपलब्ध पाठों में इस नाम का योग नहीं मिला। इसलिए नीचे के शास्त्रीय योग अलग से, श्लोक-प्रमाण सहित दिए गए हैं।</div>
        ${ks.sources.map(srcBlock).join('')}
      </div>
      ${order.filter(g => groups[g]).map(g => `<div class="sec"><h3>${esc(g)}</h3>${groups[g].map(ruleCard).join('')}</div>`).join('')}
      <div class="sec"><h3>शान्ति व उपाय (शास्त्र-वचन)</h3>
        ${res.remedies.map(m => `<div class="rule"><div class="rule-h"><b>${esc(m.title)}</b></div>${m.sources.map(srcBlock).join('')}</div>`).join('')}
      </div>
      <div class="sec"><h3>संदर्भ ग्रंथ-सूची</h3><ol class="biblio">
        ${Object.values(books).map(b => `<li><b>${esc(b.granth)}</b>${b.edition ? ' — ' + esc(b.edition) : ''}<br><span class="ref">${[...b.refs].filter(Boolean).map(esc).join('; ')}</span></li>`).join('')}
      </ol></div>
      <div class="disc">${esc(res.strength_standard)}<br>
        ग्रह-स्थिति Swiss Ephemeris (लाहिरी अयनांश) से। श्लोक जहाँ "छपी पुस्तक से मिलाया" लिखा है, वहाँ पाठ और पृष्ठ-संख्या दिए गए संस्करण से हैं; बाक़ी पाठ पुस्तक से मिलाए जा रहे हैं।
        यह रिपोर्ट शास्त्रीय नियमों की जानकारी है; जीवन के बड़े निर्णय पूरी कुंडली देखकर विद्वान ज्योतिषी की सलाह से लें।</div>
    </div>`;
    $('report').hidden = false;
    $('pdfBtn').hidden = false;
  }

  async function make() {
    const k = list[+$('kundaliSel').value];
    if (!k) { $('status').textContent = 'पहले पत्रिका पर कुंडली बनाएँ।'; return; }
    if (allowedRef !== keyOf(k)) return start();
    $('status').textContent = '⏳ ग्रह-गणना हो रही है…';
    try {
      const calc = await PatrikaEngineBridge.calculatePatrikaPlanets({ name: k.name, gender: k.gender || 'male', date: k.date, time: k.time, city: k.city, lat: k.lat, lon: k.lon, tz: k.tz || 5.5 });
      const res = SRAKaalsarp.evaluate(calc);
      current = { k, calc, res };
      render(k, calc, res);
      $('status').textContent = `✓ ${res.rules.filter(r => r.applies).length} योग/स्थितियाँ आपकी कुंडली में मिलीं (कुल ${res.rules.length} नियम जाँचे)।`;
      $('report').scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      console.error(e);
      $('status').textContent = 'गणना नहीं हो सकी — इंटरनेट देखें और दोबारा प्रयास करें। (' + (e.message || e) + ')';
    }
  }

  async function pdf() {
    if (!current) return;
    const btn = $('pdfBtn'); btn.disabled = true; btn.textContent = 'PDF बन रही है…';
    const name = `Kaalsarp-Report-${(current.k.name || 'jatak').replace(/[^\p{L}\p{M}\p{N}]+/gu, '-')}.pdf`;
    // scrollX/scrollY 0: without them html2canvas shifted the capture by the page's scroll position,
    // so the PDF began with a blank band, lost that much from the end, and was cut on the right.
    try {
      // iPhone/iPad Safari refuses canvases over ~16.7 million pixels, which gives blank PDFs there.
      const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const scale = ios ? Math.min(2, Math.sqrt(16e6 / (734 * $('report').scrollHeight))) : 2;
      const w = html2pdf().set({
        margin: [10, 8, 14, 8], filename: name,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['.rule', '.verdict', '.rp-chart', 'li'] }
      }).from($('report')).toPdf().get('pdf').then(p => {
        const n = p.internal.getNumberOfPages();
        for (let i = 1; i <= n; i++) {
          p.setPage(i); p.setFontSize(8); p.setTextColor(120);
          p.text(`${i} / ${n}`, 105, 290, { align: 'center' });
          p.text('shriramjiastro.in', 10, 290);
          p.text('Kaalsarp & Sarpa Yoga Report', 200, 290, { align: 'right' });
        }
      });
      const blob = await w.outputPdf('blob');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new File([blob], name, { type: 'application/pdf' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    } catch (e) {
      console.error(e); alert('PDF नहीं बन सकी — दोबारा प्रयास करें।');
    } finally { btn.disabled = false; btn.textContent = '⬇ PDF डाउनलोड'; }
  }

  // ---------- ₹251 payment (same flow as the Manglik report: price and Sutradhar lead come from the server) ----------
  const SERVICE = 'kaalsarp_dosha';
  const keyOf = k => (k.id || ((k.name || 'jatak').trim().toLowerCase() + '_' + (k.date || '') + '_' + (k.time || ''))).replace(/[^a-zA-Z0-9_-]/g, '_');
  // The report opens only with a pass the server issued after checking the Razorpay receipt (or SaaS
  // unlock), and the server re-checks that pass every time the report opens.
  const passKey = k => 'sra_kaalsarp_pass_' + keyOf(k);
  const getPass = k => { try { return JSON.parse(localStorage.getItem(passKey(k)) || 'null'); } catch (e) { return null; } };
  const api = path => (window.SraCouponEngine && SraCouponEngine.apiBase ? SraCouponEngine.apiBase() : 'https://sra-canonical-engine.onrender.com') + '/api/sutradhar/unlock/' + path;
  async function post(path, body) {
    const r = await fetch(api(path), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('server ' + r.status);
    return r.json();
  }
  async function serverSaysPaid(k) {
    const p = getPass(k);
    if (!p || !p.proof || !p.token) return false;
    const r = await post('check', { service_id: SERVICE, report_ref: keyOf(k), proof: p.proof, token: p.token });
    return !!r.ok;
  }
  let allowedRef = null;   // make() renders only for the kundali the server just confirmed
  const phoneVal = () => ($('phoneIn').value || '').replace(/\D/g, '').slice(-10);
  let lead = null, coupon = '', paidAmount = null;
  try { $('phoneIn').value = (localStorage.getItem('sra_verified_mobile') || '').replace(/\D/g, '').slice(-10); } catch (e) {}

  function selected() { return list[+$('kundaliSel').value]; }

  async function start() {
    const k = selected();
    if (!k) { $('status').textContent = 'पहले पत्रिका पर कुंडली बनाएँ।'; return; }
    const ph = phoneVal();
    if (ph.length !== 10) { $('status').textContent = 'कृपया 10 अंकों का मोबाइल नंबर डालें।'; $('phoneIn').focus(); return; }
    try { localStorage.setItem('sra_verified_mobile', ph); localStorage.setItem('sra_user_phone', ph); } catch (e) {}
    $('status').textContent = '⏳ भुगतान की स्थिति जाँची जा रही है…';
    let paid = false;
    try { paid = await serverSaysPaid(k); }
    catch (e) { $('status').textContent = 'भुगतान की जाँच नहीं हो सकी — इंटरनेट देखकर दोबारा प्रयास करें।'; return; }
    if (paid) { allowedRef = keyOf(k); $('paywall').hidden = true; return make(); }
    showPaywall(k, ph);
  }

  function showPaywall(k, ph) {
    $('report').hidden = true; $('pdfBtn').hidden = true;
    const n = SRAKaalsarp.RULES.length, srcs = Object.keys(SRAKaalsarp.SOURCES).length;
    $('paywall').innerHTML = `
      <span class="pw-badge">🔒 रिपोर्ट भुगतान के बाद खुलेगी</span>
      <h2 style="margin-top:10px">कालसर्प व सर्प-योग रिपोर्ट — ${esc(k.name)}</h2>
      <div class="muted">${esc(k.date)} • ${esc(k.time)} • ${esc(k.city || '')}</div>
      <div class="pw-list">
        <div><b>कालसर्प योग</b>पूर्ण / आंशिक, और 12 में से कौन-सा प्रकार</div>
        <div><b>${n} शास्त्रीय नियमों की जाँच</b>सर्प-योग, सर्प-शाप, सर्प-भय, ग्रहण-जन्म, सर्प-द्रेष्काण</div>
        <div><b>${srcs} श्लोक-प्रमाण</b>हर नियम के साथ ग्रंथ, अध्याय, श्लोक और पृष्ठ</div>
        <div><b>शास्त्रोक्त उपाय</b>नागपूजा, राहु-केतु जप, समिधा, दक्षिणा • A4 PDF</div>
      </div>
      <div class="pw-price"><span>देय दक्षिणा (GST सहित)</span><span id="pwPrice">₹251</span></div>
      <button class="pw-pay" id="pwPay" type="button">💳 ₹251 भुगतान करें (UPI / कार्ड)</button>
      <div class="muted" style="margin-top:6px;text-align:center">Razorpay से सुरक्षित भुगतान • भुगतान होते ही रिपोर्ट खुल जाएगी</div>
      <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">कोड है?</summary>
        <div class="pw-code"><input id="pwCode" placeholder="कोड" autocomplete="off"><button class="btn ghost" id="pwCodeBtn" type="button">लागू करें</button></div>
        <div id="pwCodeMsg" class="muted" style="margin-top:6px"></div>
      </details>`;
    $('paywall').hidden = false;
    $('paywall').scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('status').textContent = '';
    $('pwPay').addEventListener('click', () => pay(k));
    $('pwCodeBtn').addEventListener('click', () => applyCode(k));
    $('pwCode').addEventListener('keydown', e => { if (e.key === 'Enter') applyCode(k); });
    lead = null;
    if (window.SraCouponEngine && SraCouponEngine.fetchServerQuote) {
      SraCouponEngine.fetchServerQuote(ph, SERVICE).then(q => {
        if (!q) return;
        if (q.net_price) { $('pwPrice').textContent = '₹' + q.net_price; $('pwPay').textContent = `💳 ₹${q.net_price} भुगतान करें (UPI / कार्ड)`; }
        if (q.has_active_lead) lead = { id: q.lead_id || '', sutradhar: (q.sutradhar_code || q.sutradhar_id || '').replace(/-/g, '') };
      }).catch(() => {});
    }
  }

  function applyCode(k) {
    const raw = $('pwCode').value || '', msg = $('pwCodeMsg');
    SraCouponEngine.handleCodeBox({
      serviceId: SERVICE, code: raw, reportRef: keyOf(k),
      remember: c => { coupon = c; },
      onUnlock: r => unlock(k, { unlock_id: r.unlock_id }, 'SAAS_' + r.unlock_id),
      show: (ok, m) => { msg.style.color = ok ? '#166a43' : (ok === null ? '#7a5a00' : '#b3261e'); msg.textContent = (ok ? '✓ ' : ok === null ? '' : '❌ ') + m; }
    });
  }

  function pay(k) {
    SraCouponEngine.openServerCheckout({
      serviceId: SERVICE, phone: phoneVal(), name: k.name || 'जातक', code: coupon,
      description: `कालसर्प व सर्प-योग रिपोर्ट - ${k.name || 'जातक'}`,
      notes: { report_type: 'kaalsarp_dosha_report' },
      onSuccess: (resp, order) => {
        paidAmount = order ? order.net_price : null;
        unlock(k, { order_id: resp.razorpay_order_id, payment_id: resp.razorpay_payment_id, signature: resp.razorpay_signature }, resp.razorpay_payment_id);
      }
    });
  }

  async function unlock(k, receipt, paymentId) {
    const key = keyOf(k);
    $('status').textContent = '⏳ भुगतान की पुष्टि हो रही है…';
    let v = null;
    for (let i = 0; i < 3 && !v; i++) {
      try { v = await post('verify', Object.assign({ service_id: SERVICE, report_ref: key }, receipt)); }
      catch (e) { await new Promise(r => setTimeout(r, 2500)); }
    }
    if (!v || !v.ok) {
      $('status').textContent = (v && v.message) || 'भुगतान की पुष्टि नहीं हो सकी। पैसा कटा हो तो support@shriramjiastro.in पर भुगतान ID भेजें: ' + (paymentId || '');
      return;
    }
    try { localStorage.setItem(passKey(k), JSON.stringify({ proof: v.proof, token: v.token })); } catch (e) {}
    allowedRef = key;
    const sid = (lead && lead.sutradhar) || (window.SraCouponEngine ? SraCouponEngine.getActiveSutradharId() : '');
    // payment record for the admin dashboard (sra-records.js stores it in Firestore); the server order is the real record
    if (!/^SAAS_/.test(paymentId || '')) {
      fetch('api/save_payment.php', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ razorpay_payment_id: paymentId, student_name: k.name || '', student_phone: phoneVal(),
          plan_name: 'Kaalsarp & Sarpa Yoga Report (₹' + (paidAmount || 251) + ')', report_type: 'kaalsarp_dosha_report',
          amount: paidAmount || 251, discount: 0, coupon_code: coupon || sid || '', sutradhar_id: sid || '', status: 'completed', kundali_key: key })
      }).catch(() => {});
    }
    $('paywall').hidden = true;
    make();
  }

  $('makeBtn').addEventListener('click', start);
  $('pdfBtn').addEventListener('click', pdf);
  loadList();
})();
</script>
<!-- Whole page in the chosen language: dictionaries + machine fill-in (sra-i18n.js), other languages (sra-translate.js) -->
<script src="sra-i18n.js" defer></script>
</body>
</html>
