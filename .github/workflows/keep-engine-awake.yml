# Keeps the free Render calculation server (sra-canonical-engine, see render.yaml) awake.
# A free Render service sleeps after 15 minutes without requests, and the next visitor then
# waits about 30 seconds for the first kundali. Asking /health every 10 minutes avoids that.
name: Keep calculation server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 https://sra-canonical-engine.onrender.com/health
